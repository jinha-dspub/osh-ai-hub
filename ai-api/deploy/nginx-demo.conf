# .3: inside the existing HTTPS server for tools.osh.ai.kr.
# Create/reuse an approved htpasswd file before nginx -t. Do not publish the demo without auth.
location = /demo {
    return 308 /demo/;
}
location ^~ /demo/ {
    auth_basic "OSH AI Demo";
    auth_basic_user_file /etc/nginx/.htpasswd-demo;
    # Preserve the complete /demo/... path; no trailing slash here.
    proxy_pass http://192.168.0.6:8103;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # MUST overwrite the inbound value with the nginx-authenticated user.
    proxy_set_header X-OSH-Authenticated-User $remote_user;
    proxy_set_header Authorization "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 240s;
    proxy_send_timeout 30s;
    client_max_body_size 16k;
    proxy_cache off;
}
