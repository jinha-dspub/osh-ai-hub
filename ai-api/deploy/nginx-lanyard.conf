# OPTIONAL. Only for opening the analyzer without the DEMO login; it already works under the
# existing /demo/ location (uploads are chunked below 16k).
# .3: add inside the existing HTTPS server for tools.osh.ai.kr, BEFORE `location ^~ /demo/`.
# Public (no Basic auth) only for the lanyard analyzer. .6 still accepts only .3 as the peer
# and opens this path only because its unit sets OSH_PUBLIC_DEMOS=lanyard.
# In the http {} block (once):
#   limit_req_zone $binary_remote_addr zone=osh_lanyard:10m rate=20r/m;
location ^~ /demo/lanyard/ {
    limit_req zone=osh_lanyard burst=10 nodelay;
    proxy_pass http://192.168.0.6:8103;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Never forward a client-supplied user; this path is public.
    proxy_set_header X-OSH-Authenticated-User "";
    proxy_set_header Authorization "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 240s;
    proxy_send_timeout 60s;
    # Uploads are chunked; keep the same body limit as the authenticated /demo/ location.
    client_max_body_size 16k;
    proxy_cache off;
}
